<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Six Disney characters rendered in 3D in the browser — Rosetta, Sadness, Disgust, Judy, Moana and Vanellope. Open one to see it fly into place, with its film's clips alongside. Built with Three.js."
    />
    <!-- The page's own ground, not the favicon's: this tints the browser chrome
         around the site, which is white here. -->
    <meta name="theme-color" content="#ffffff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>Disney Characters — six characters in 3D, in the browser</title>
    <link rel="canonical" href="https://disney-characters.pages.dev/" />

    <!-- The interface is Vijay Verma's design; this is a build of it. His own
         site here, where a machine-readable author wants a person's home
         rather than one portfolio of theirs -- the footer's visible credit
         points at the Dribbble shot this was built from instead. -->
    <meta name="author" content="Vijay Verma (@realvjy)" />
    <link rel="author" href="https://vjy.me/" />

    <!-- The mark is the Disney D alone, on a square. The full wordmark used to
         be the favicon and it is 2.4x wider than it is tall, which at the 16px
         a tab actually renders is an unreadable smear. White on navy rather
         than black on nothing, so it survives a dark tab bar too.
         The PNGs are for Safari and iOS, which do not take the SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Sharing. og:image must be absolute -- a crawler has no page to resolve
         a relative path against -- and every scraper wants its own spelling of
         the same four facts, so they are repeated rather than shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Disney Characters" />
    <meta property="og:title" content="Disney Characters — six characters in 3D, in the browser" />
    <meta
      property="og:description"
      content="Six Disney characters rendered in 3D in the browser. Open one to see it fly into place, with its film's clips alongside."
    />
    <meta property="og:url" content="https://disney-characters.pages.dev/" />
    <meta property="og:image" content="https://disney-characters.pages.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The character carousel: Rosetta, Sadness, Disgust and Judy standing on their cards, each rendered in 3D." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Disney Characters — six characters in 3D, in the browser" />
    <meta
      name="twitter:description"
      content="Six Disney characters rendered in 3D in the browser. Open one to see it fly into place, with its film's clips alongside."
    />
    <meta name="twitter:image" content="https://disney-characters.pages.dev/og.png" />
    <meta name="twitter:image:alt" content="The character carousel: Rosetta, Sadness, Disgust and Judy standing on their cards, each rendered in 3D." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="fontsStylesheet"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;500;700&family=Pacifico&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;500;700&family=Pacifico&display=swap"
      />
    </noscript>

    <!-- the default character's model: shared by the main viewport and the
         carousel card via the model cache, so it's the one fetch that
         actually gates first paint -- starting it during HTML parsing beats
         waiting for the JS bundle to load and request it itself -->
    <link rel="preload" href="/models/rosetta.glb" as="fetch" crossorigin />

    <!-- order matters: each overrides the one before at its own breakpoint,
         so the cascade does the work rather than specificity -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/tablet.css" />
    <link rel="stylesheet" href="/src/mobile.css" />
  </head>
  <body>
    <!-- The loading gate. Written here rather than built by the bundle,
         because the bundle is what it exists to cover: three.js plus six
         characters' worth of setup have to load before a single line of
         src/loading.js can run, and until then this is the only thing that
         can be on screen. src/loading.js adopts it and lifts it away. -->
    <div class="loading" id="loading">
      <div class="loading-mark" id="loadingMark" role="img" aria-label="Loading">
        <span class="loading-mark-ghost"></span>
        <span class="loading-mark-fill"></span>
      </div>
    </div>

    <div class="page">
      <header class="nav">
        <div class="logo">
          <img class="logo-mark" src="/disney.svg" alt="Disney" />
          <span class="logo-word">Characters</span>
        </div>
        <div class="search">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input class="search-input" type="text" placeholder="Search characters...." aria-label="Search characters" />
        </div>
        <button class="menu-btn" type="button" aria-label="Menu">
          <span>Menu</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="4" cy="4" r="1.8" fill="currentColor" />
            <circle cx="12" cy="4" r="1.8" fill="currentColor" />
            <circle cx="4" cy="12" r="1.8" fill="currentColor" />
            <circle cx="12" cy="12" r="1.8" fill="currentColor" />
          </svg>
        </button>
      </header>

      <main id="app" class="app"></main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
